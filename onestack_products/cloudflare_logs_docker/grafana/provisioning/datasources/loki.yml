apiVersion: 1

datasources:
  - name: Loki
    uid: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      # Admin view across every tenant. "fake" holds logs written before
      # tenancy was enabled and can be dropped once retention (14 days) has
      # expired them.
      httpHeaderValue1: usual-suspects|cloudflare-workers|fake
