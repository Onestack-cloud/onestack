# Every request needs an X-Scope-OrgID tenant. Usual Suspects logs live in
# the "usual-suspects" tenant and the usual-suspects-api proxy can only read
# that tenant, whatever LogQL it is sent.
auth_enabled: true

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 336h
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

querier:
  # Lets the admin Grafana datasource read several tenants with
  # "tenant-a|tenant-b". Services that must stay in one tenant reject "|".
  multi_tenant_queries_enabled: true

analytics:
  reporting_enabled: false

