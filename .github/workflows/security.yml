name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install isolated maintenance tooling without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
        working-directory: infrastructure/security/bot
      - run: node infrastructure/security/bot/verify-braces.mjs
      - run: python3 .security/runtime-pins.py
      - run: node --test .security/runtime-selfcheck.ts
      - run: python3 -m unittest discover -s infrastructure/security -p 'test_*.py'
      - name: Check runtime and locked dependencies
        run: node .security/ci.ts
        env:
          SECURITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      - name: Retain the complete security report in job logs and summary
        if: always()
        run: node .security/report.ts
