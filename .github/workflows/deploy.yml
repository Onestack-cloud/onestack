name: Build and deploy

# Builds ghcr.io/onestack-cloud/onestack:latest, which production's
# /root/onestack_docker compose file pulls. Deploys run from GitLab through the
# server's restricted CI key (onestack-app-deploy-ssh); the SSH deploy job here
# was removed after the server's September hardening dropped its key.

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build the complete release image without publication
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: onestack-node26-validation:local

  node-services:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [ingest, usual-suspects-api]
    steps:
      - uses: actions/checkout@v4
      - name: Build the Node service without publication
        uses: docker/build-push-action@v6
        with:
          context: onestack_products/cloudflare_logs_docker/${{ matrix.service }}
          push: false
          tags: node26-${{ matrix.service }}-validation:local

  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
